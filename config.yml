# Pipeline directory layout
paths:
  raw_dir: data/rawdata
  proc_dir: data/procdata
  results_dir: data/results

run:
  # Supported values: discovery_scRNA, discovery_bulk, discovery_presorted
  mode: discovery_scRNA
  name: discovery_scRNA

input:
  # Use paths under data/rawdata/<dataset-name>/ when adding local datasets.
  discovery_dataset_name: discovery_scRNA
  expression_matrix: null
  expression_matrices: null
  annotation_file: null
  expression_type: scRNA
  scale_by: null
  plot_columns: []
  cibersortx_username: null
  cibersortx_token: null
  cell_type_fractions: null

pipeline:
  steps_to_skip: []
  filter_genes: cell type specific
  filter_non_cell_type_specific_genes: false
  threads: 10
  nmf_restarts: 5
  # NMF backend: r, torch, or auto. auto uses torch when a GPU backend is available.
  nmf_backend: r
  nmf_torch_device: auto
  nmf_max_iter: 500
  nmf_tolerance: 0.0001
  max_states_per_cell_type: 20
  cophenetic_cutoff: 0.975
  jaccard_p_value_cutoff: 1
  min_states_in_ecotypes: 3
  cibersortx_fractions_singularity: null
  cibersortx_hires_singularity: null
